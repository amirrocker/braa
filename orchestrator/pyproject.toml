[project]
name = "bera-orchestrator"
version = "0.1.0"
description = "Berisha & Rocker Agentic Automation - Phase 1 orchestrator backend (Managed Agents provisioning, roster-add core-lock, Telegram delivery, webhook handling)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.75.0",
    "flask>=3.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
bera-setup = "bera_orchestrator.cli:setup_customer"
bera-add-role = "bera_orchestrator.cli:add_role"
bera-webhook-server = "bera_orchestrator.cli:run_webhook_server"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bera_orchestrator*"]
